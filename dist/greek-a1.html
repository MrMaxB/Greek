<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d3b66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ελληνικά A1">
  <title>Ελληνικά A1 — тренажёр греческого</title>
  <style>
/* ============================================================
   Ελληνικά A1 — стили. Греческая бело-синяя палитра.
   Мобайл-фёрст, без зависимостей.
   ============================================================ */
:root {
  --blue: #0d3b66;
  --blue-2: #1b5e9c;
  --sky: #2a9df4;
  --bg: #eef3f9;
  --card: #ffffff;
  --ink: #14233a;
  --muted: #6b7a90;
  --line: #e6ecf5;
  --ok: #1faa59;
  --bad: #e4572e;
  --gold: #f2a900;
  --r: 16px;
  --shadow: 0 2px 10px rgba(13,59,102,.06);
  --shadow-lg: 0 8px 28px rgba(13,59,102,.10);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
}
#app { max-width: 760px; margin: 0 auto; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: var(--blue-2); cursor: pointer; text-decoration: underline; }
.muted { color: var(--muted); }
.center { text-align: center; }
.small { font-size: .85rem; }

/* ---------- NAV (тонкая шапка + бургер-меню) ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--blue); color: #fff;
  padding: 7px 12px; box-shadow: 0 2px 12px rgba(0,0,0,.12);
  display: flex; align-items: center; gap: 10px;
}
.burger { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 8px 6px; flex: 0 0 auto; }
.burger span { display: block; width: 22px; height: 2px; background: #fff; border-radius: 2px; transition: .2s; }
.burger:active span { background: var(--gold); }
.brand { font-size: 1.1rem; font-weight: 800; letter-spacing: .3px; flex: 1; }
.brand span { color: var(--gold); }
.acct-chip {
  background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.35);
  border-radius: 99px; padding: 5px 12px; font-weight: 700; font-size: .8rem;
  max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 0 auto;
}
.acct-chip:active { background: rgba(255,255,255,.28); }

/* Выезжающее меню */
.menu-backdrop {
  position: fixed; inset: 0; z-index: 79; background: rgba(8,20,40,.45);
  opacity: 0; pointer-events: none; transition: opacity .22s ease;
}
.menu-backdrop.open { opacity: 1; pointer-events: auto; }
.menu {
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 80;
  width: 270px; max-width: 82%; background: var(--card);
  transform: translateX(-100%); transition: transform .22s ease;
  box-shadow: 2px 0 28px rgba(8,20,40,.22);
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
  overflow-y: auto; display: flex; flex-direction: column;
}
.menu.open { transform: translateX(0); }
.menu-head { font-weight: 800; color: var(--blue); padding: 8px 20px 12px; font-size: 1.15rem; }
.menu-item {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 13px 20px; font-weight: 600; color: var(--ink); font-size: 1rem;
}
.menu-item .mi-ic { font-size: 1.25rem; width: 26px; text-align: center; }
.menu-item.active { background: #eef4fb; color: var(--blue-2); box-shadow: inset 4px 0 0 var(--gold); }
.menu-item:active { background: #e6eef8; }

.screen { padding: 14px 14px; }

/* ---------- HERO / HOME ---------- */
.hero { padding: 4px 0 2px; }
.hero h1 { margin: 6px 0 2px; font-size: 2rem; letter-spacing: -.5px; }
.hero .sub { margin: 0 0 6px; color: var(--muted); }
.banner {
  background: #fff6e0; border: 1px solid #f3d98a; color: #7a5a10;
  padding: 10px 14px; border-radius: 12px; font-size: .85rem; margin-bottom: 14px;
}
.cards-row { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
.stat {
  flex: 1; min-width: 90px; background: var(--card); border-radius: var(--r);
  padding: 14px 10px; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--line);
}
.stat-num { font-size: 1.5rem; font-weight: 800; color: var(--blue); }
.stat-lbl { font-size: .72rem; color: var(--muted); margin-top: 2px; }

.progress-bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress-bar.mini { height: 6px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--sky), var(--blue-2)); border-radius: 99px; transition: width .4s; }

.cta { margin: 18px 0; }
.big-btn {
  width: 100%; background: var(--card); color: var(--ink); border-radius: var(--r);
  padding: 16px; font-size: 1.05rem; font-weight: 700; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 10px;
  border: 1px solid var(--line); transition: transform .08s ease, box-shadow .15s ease;
}
.big-btn small { font-weight: 500; color: var(--muted); font-size: .78rem; }
.big-btn.primary { background: linear-gradient(135deg, var(--blue-2), var(--blue)); color: #fff; border: none; box-shadow: 0 6px 18px rgba(13,59,102,.22); }
.big-btn.primary small { color: #cfe0f2; }
.big-btn.ghost { background: var(--card); }
.big-btn.slim { width: auto; padding: 10px 16px; font-size: .95rem; }
.big-btn.danger { color: var(--bad); border-color: #f3c4b8; margin-top: 24px; }
.big-btn:active { transform: translateY(1px) scale(.997); }

.section-title { margin: 22px 0 10px; font-size: 1.05rem; padding-left: 11px; position: relative; }
.section-title::before { content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; width: 4px; border-radius: 4px; background: var(--gold); }
.steps { padding-left: 20px; color: var(--ink); }
.steps li { margin-bottom: 8px; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile {
  background: var(--card); border-radius: var(--r); padding: 18px 10px; box-shadow: var(--shadow);
  font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 1px solid var(--line);
  transition: transform .08s ease;
}
.tile:active { transform: scale(.97); }
.tile-ic { font-size: 1.8rem; }

/* ---------- PAGE HEAD ---------- */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.page-head h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.2px; }
.counter { background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-weight: 700; font-size: .85rem; color: var(--blue); }
.back { color: var(--blue-2); font-weight: 600; }

/* ---------- SPEAK BTN ---------- */
.speak {
  background: #eaf3fc; color: var(--blue-2); border-radius: 8px; padding: 2px 8px;
  font-size: .9rem; vertical-align: middle; margin-left: 4px;
}
.speak:active { background: #d6e8fa; }

/* ---------- ALPHABET ---------- */
.letter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.letter {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px;
  text-align: center; box-shadow: var(--shadow); transition: transform .1s;
}
.letter:active { transform: scale(.97); }
.letter.dig .letter-glyph { color: var(--blue-2); }
.letter-glyph { font-size: 1.7rem; font-weight: 800; color: var(--blue); }
.letter-name { font-size: .8rem; color: var(--muted); }
.letter-sound { font-size: .82rem; margin-top: 4px; }
.letter-ex { font-size: .78rem; color: var(--blue-2); margin-top: 4px; }

/* ---------- QUIZ ---------- */
.quiz-prompt { background: var(--card); border-radius: var(--r); padding: 16px; text-align: center; box-shadow: var(--shadow); margin: 10px 0; }
.quiz-prompt.listen { padding: 18px 14px; }
.quiz-prompt.compact { padding: 10px; margin: 8px 0; }
.quiz-prompt.compact .big-letter { font-size: 2rem; }
.q-ask { margin: 6px 0; }
.page-head { margin-bottom: 6px; }
.feedback { margin-top: 8px; }
.big-letter { font-size: 2.3rem; font-weight: 800; color: var(--blue); }
.big-letter.sm { font-size: 1.7rem; }
.play-big { background: linear-gradient(135deg, var(--blue-2), var(--blue)); color: #fff; border-radius: 14px; padding: 13px 22px; font-size: 1.05rem; font-weight: 700; margin: 4px; }
.play-slow { background: #eaf3fc; color: var(--blue-2); border-radius: 14px; padding: 13px 16px; font-weight: 700; margin: 4px; }
.mic-btn { display: block; width: 100%; background: linear-gradient(135deg, #1faa59, #0d7a3f); color: #fff; border-radius: 16px; padding: 20px; font-size: 1.15rem; font-weight: 800; box-shadow: var(--shadow); margin: 12px 0 4px; }
.mic-btn:disabled { opacity: 1; }
.mic-btn.rec { background: linear-gradient(135deg, #e4572e, #b23a18); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(228,87,46,.5); } 50% { box-shadow: 0 0 0 14px rgba(228,87,46,0); } }
.opts { display: grid; gap: 8px; margin: 6px 0; }
.opt {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px;
  font-size: .98rem; font-weight: 600; text-align: center; box-shadow: var(--shadow); transition: .12s;
}
.opt small { font-weight: 400; color: var(--muted); font-size: .8rem; }
.opt br + * , .opt small { display: inline-block; margin-top: 2px; }
.opt:active { transform: scale(.98); border-color: var(--blue-2); }
@media (hover: hover) { .opt:hover { border-color: var(--sky); } }
.opt.ok { border-color: var(--ok); background: #e8f8ee; color: #137a3f; }
.opt.bad { border-color: var(--bad); background: #fdece7; color: #b23a18; }
.feedback { margin-top: 10px; }
.ok-msg { color: var(--ok); font-weight: 700; text-align: center; padding: 8px; }
.bad-msg { color: var(--bad); font-weight: 700; text-align: center; padding: 8px; }

/* ---------- FLASHCARD ---------- */
.flashcard {
  background: var(--card); border-radius: 18px; padding: 20px 18px; text-align: center;
  box-shadow: var(--shadow-lg); border: 1px solid var(--line); margin: 10px 0; min-height: 130px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.card-tag { font-size: .75rem; color: var(--muted); background: #f0f4fa; padding: 3px 10px; border-radius: 99px; }
.flash-gr { font-size: 2.4rem; font-weight: 800; color: var(--blue); }
.flash-tr { color: var(--muted); font-size: 1rem; }
.flash-ru { font-size: 1.5rem; font-weight: 700; margin-top: 6px; }
.reveal { margin-top: 10px; background: var(--blue-2); color: #fff; border-radius: 12px; padding: 12px 20px; font-weight: 700; }

.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
.grades.simple { grid-template-columns: repeat(2, 1fr); margin-top: 14px; }
.grade { border-radius: 12px; padding: 12px 6px; font-weight: 700; color: #fff; display: flex; flex-direction: column; gap: 2px; }
.grade small { font-weight: 500; opacity: .85; font-size: .68rem; }
.g0 { background: var(--bad); }
.g1 { background: var(--gold); }
.g2 { background: var(--blue-2); }
.g3 { background: var(--ok); }
.grade:active { transform: translateY(1px); }

/* ---------- RESULT ---------- */
.result { text-align: center; padding: 30px 10px; }
.big-score { font-size: 3rem; font-weight: 800; color: var(--blue); margin: 6px 0; }
.big-score.fail { color: var(--bad); }

/* ---------- EXAM ---------- */
.exam-sec { display: inline-block; background: var(--blue); color: #fff; font-size: .75rem; font-weight: 700; padding: 4px 12px; border-radius: 99px; margin-bottom: 10px; }
.exam-q { font-size: 1.25rem; font-weight: 700; color: var(--ink); margin: 6px 0 12px; line-height: 1.4; }
.exam-q .blank { color: var(--gold); letter-spacing: 1px; }
.passage { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; box-shadow: var(--shadow); padding: 12px 14px; }
.passage-label { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.passage-gr { font-size: 1.15rem; color: var(--blue); line-height: 1.6; }
.passage-tr { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.passage-tr summary { font-size: .82rem; color: var(--blue-2); font-weight: 600; cursor: pointer; }
.passage-tr summary::-webkit-details-marker { color: var(--blue-2); }
.passage-tr .muted { margin-top: 6px; }

/* ---------- DECKS ---------- */
.deck-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.deck-tile { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); text-align: left; transition: transform .08s ease, border-color .15s; width: 100%; }
.deck-tile:active { transform: scale(.985); border-color: var(--sky); }
.deck-ic { font-size: 2rem; flex: 0 0 auto; }
.deck-body { flex: 1; }
.deck-title { font-weight: 700; }
.deck-meta { font-size: .78rem; color: var(--muted); margin: 2px 0 6px; }

.mode-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 8px; margin: 14px 0; }
.mode-btn { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 4px; font-weight: 600; font-size: .78rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; align-items: center; transition: transform .08s ease, border-color .15s; }
.mode-btn:active { transform: scale(.96); border-color: var(--sky); }
.mode-btn span { font-size: 1.4rem; }
.mode-btn.hot { border-color: var(--gold); background: #fffaf0; }
.dict-hint { margin-top: 10px; }
.answer-ru { font-weight: 500; font-size: .9rem; color: var(--ink); margin-top: 4px; }

.word-list { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
.word-row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.w-audio { flex: 0 0 auto; }
.w-audio .speak { margin: 0; padding: 6px 10px; font-size: 1rem; }
.w-gr { font-weight: 700; color: var(--blue); flex: 1.4; }
.w-tr { color: var(--muted); flex: 1; font-size: .85rem; }
.w-ru { flex: 1.2; }

/* ---------- TYPE MODE ---------- */
.type-ru { font-size: 1.6rem; font-weight: 700; }
.type-input { width: 100%; padding: 14px; font-size: 1.3rem; border: 2px solid var(--line); border-radius: 14px; margin: 12px 0 8px; text-align: center; }
.type-input:focus { outline: none; border-color: var(--sky); }
.kbd-hint { font-size: .78rem; color: var(--muted); margin-bottom: 8px; }
.gkbd { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.gkbd-row { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.gkey { background: var(--card); border: 1px solid var(--line); border-radius: 8px; min-width: 30px; padding: 10px 6px; font-size: 1.05rem; font-weight: 700; color: var(--blue); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.gkey.wide { min-width: 48px; }
.gkey:active { background: #e6eef8; }

/* ---------- WRITING ---------- */
.build-area { min-height: 54px; border: 2px dashed var(--sky); border-radius: 12px; padding: 10px; margin: 12px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #f7fbff; }
.bank-area { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.tok { background: var(--card); border: 1.5px solid var(--blue-2); color: var(--blue); border-radius: 10px; padding: 9px 13px; font-size: 1.05rem; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.tok.built { background: var(--blue-2); color: #fff; border-color: var(--blue-2); }
.tok:active { transform: scale(.96); }
.gap-sentence { font-size: 1.4rem; font-weight: 700; color: var(--blue); line-height: 1.7; }
.gap-sentence .blank { color: var(--gold); letter-spacing: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chip { background: #eef4fb; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-weight: 700; color: var(--blue); }
.chip.done { background: #e8f8ee; border-color: var(--ok); color: #137a3f; }
.chip.done::before { content: "✓ "; }
.type-input.area { min-height: 110px; text-align: left; font-size: 1.15rem; resize: vertical; line-height: 1.5; }

/* ---------- READING ---------- */
.r-meta { margin: 2px 0 10px; color: var(--muted); font-size: .9rem; }
.lvl-badge { display: inline-block; background: var(--gold); color: #4a3500; font-weight: 800; font-size: .72rem; padding: 2px 9px; border-radius: 99px; margin-right: 4px; }
.reader { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 14px; box-shadow: var(--shadow); margin: 10px 0; }
.r-sent { padding: 10px 0; border-bottom: 1px solid var(--line); }
.r-sent:last-child { border-bottom: none; }
.r-text { font-size: 1.3rem; line-height: 2; color: var(--ink); }
.rword { color: var(--blue); border-bottom: 1px dotted var(--sky); cursor: pointer; padding: 1px 0; border-radius: 3px; }
.rword:active { background: #dceafa; }
.r-tools { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
.r-ic { background: #eef4fb; border-radius: 8px; padding: 4px 8px; font-size: .95rem; }
.r-ic:active { background: #d6e8fa; }
.r-trans { margin-top: 8px; color: var(--muted); font-size: .95rem; background: #f5f8fc; border-radius: 8px; padding: 8px 10px; }
.wordbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
  max-width: 760px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
  background: var(--blue); color: #fff;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  box-shadow: 0 -4px 20px rgba(8,20,40,.25);
}
.wordbar[hidden] { display: none; }
.wb-spk { background: rgba(255,255,255,.18); border-radius: 10px; padding: 8px 12px; font-size: 1.1rem; flex: 0 0 auto; }
.wb-body { flex: 1; display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.wb-gr { font-weight: 800; font-size: 1.1rem; }
.wb-ru { font-size: .9rem; color: #cfe0f2; }
.wb-x { color: #cfe0f2; font-size: 1.3rem; padding: 6px 8px; flex: 0 0 auto; }

/* ---------- GRAMMAR ---------- */
/* список тем */
.lesson-list { display: flex; flex-direction: column; gap: 8px; }
.lesson-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); transition: transform .08s, border-color .15s; }
.lesson-row:active { transform: scale(.99); border-color: var(--sky); }
.lesson-ic { font-size: 1.4rem; flex: 0 0 auto; width: 1.6em; text-align: center; }
.lesson-ttl { flex: 1; font-weight: 700; color: var(--ink); }
.lesson-n { font-size: .75rem; color: var(--blue-2); background: #eef4fb; border-radius: 99px; padding: 3px 9px; flex: 0 0 auto; }
.lesson-arr { color: var(--muted); font-size: 1.4rem; flex: 0 0 auto; }
/* полная страница урока */
.lesson { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 22px; box-shadow: var(--shadow); }
.lesson p { font-size: 1.05rem; line-height: 1.75; margin: 12px 0; }
.lesson ul, .lesson ol { margin: 12px 0; padding-left: 22px; }
.lesson li { margin: 8px 0; line-height: 1.6; }
.lesson b { color: var(--blue-2); }
.lesson i { color: var(--blue); font-style: normal; background: #eef4fb; padding: 1px 6px; border-radius: 5px; }
.lesson .gtab { width: 100%; margin: 14px 0; font-size: .98rem; }
.lesson .gtab th, .lesson .gtab td { padding: 9px 11px; }
.lesson-actions { margin-top: 16px; }

.gram { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
.gram summary { display: flex; align-items: center; gap: 8px; padding: 13px 14px; font-weight: 700; cursor: pointer; color: var(--blue); list-style: none; }
.gram summary::-webkit-details-marker { display: none; }
.gram-ic { flex: 0 0 auto; }
.gram-ttl { flex: 1; }
.gex-go { flex: 0 0 auto; background: var(--blue-2); color: #fff; border-radius: 10px; padding: 7px 13px; font-weight: 800; font-size: .85rem; }
.gex-go:active { transform: scale(.96); }
.gram-body { padding: 0 16px 16px; color: var(--ink); }
.gram-body b { color: var(--blue-2); }
.gram-ic { display: inline-block; width: 1.5em; text-align: center; }
.gex-launch { margin-top: 12px; }
.gram-body p { margin: 8px 0; }
.gram-body ul { margin: 8px 0; padding-left: 20px; }
.gram-body li { margin: 4px 0; }
.gram-body i { color: var(--blue); font-style: normal; background: #eef4fb; padding: 0 4px; border-radius: 4px; }
.gtab { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: .9rem; }
.gtab th, .gtab td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; }
.gtab th { background: var(--blue); color: #fff; font-weight: 600; }
.gtab td:first-child { color: var(--muted); white-space: nowrap; }
.gtab b { color: var(--blue-2); }

/* Тренажёры грамматики */
.train-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.train-btn { background: linear-gradient(135deg, var(--blue-2), var(--blue)); color: #fff; border-radius: 16px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; box-shadow: 0 6px 18px rgba(13,59,102,.22); transition: transform .08s ease; }
.train-btn:active { transform: scale(.97); }
.train-btn span { font-size: 1.7rem; }
.train-btn small { font-weight: 500; opacity: .85; font-size: .72rem; text-align: center; }
.slot-target { font-size: 1.5rem; font-weight: 800; color: var(--blue); margin: 8px 0 2px; }

/* ---------- ACCOUNT ---------- */
.acct-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.acct-card .big-btn { margin-bottom: 0; }

/* ---------- PROGRESS ---------- */
.heat { display: flex; gap: 5px; flex-wrap: wrap; margin: 8px 0; }
.hday { width: 34px; height: 34px; border-radius: 8px; background: var(--line); display: flex; align-items: center; justify-content: center; font-size: .72rem; color: var(--muted); }
.hday.on { background: var(--ok); color: #fff; font-weight: 700; }

@media (min-width: 560px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}

    // 13. Отрицание и вопросы
    "neg-q"() {
      const B = [["___ καταλαβαίνω. (не понимаю)", "Δεν"], ["___ είσαι; (кто ты)", "Ποιος"], ["___ μένεις; (где живёшь)", "Πού"], ["___ ώρα είναι; (который час)", "Τι"], ["___ κάνεις; (как дела)", "Πώς"], ["___ κοστίζει; (сколько стоит)", "Πόσο"]];
      const pool = ["Δεν", "Ποιος", "Πού", "Τι", "Πώς", "Πόσο", "Πότε"];
      return B.map(([q, ans]) => ({ q, opts: sh(uniq([ans, ...sh(pool.filter((x) => x !== ans)).slice(0, 2)])), ans, lvl: 1 }));
    },
  };

  function conj(words) {
    const PERS = [["s2", "εσύ"], ["s3", "αυτός/-ή"], ["p1", "εμείς"], ["p2", "εσείς"], ["p3", "αυτοί"]];
    const out = [];
    words.forEach((w) => {
      const v = CONJUGATIONS.find((x) => x.word === w); if (!v) return;
      PERS.forEach(([k, lbl]) => {
        out.push({ q: `${lbl} ___ <span class="muted small">(${v.ru})</span>`, opts: mk(v.f[k], Object.values(v.f)), ans: v.f[k], lvl: 1 });
      });
    });
    return out;
  }
  function decl(gender) {
    const CASES = [
      ["genS", "Родительный ед. (кого? чего? чей?)", 2],
      ["accS", "Винительный ед. (кого? что? после предлога)", 1],
      ["nomP", "Именительный мн. (кто? что?)", 2],
      ["genP", "Родительный мн. (кого? чего?)", 3],
      ["accP", "Винительный мн. (кого? что?)", 2],
    ];
    const list = gender ? DECLENSIONS.filter((d) => d.g === gender) : DECLENSIONS;
    const out = [];
    list.forEach((d) => {
      CASES.forEach(([k, lbl, lvl]) => {
        const others = sh(uniq(Object.values(d.f)).filter((x) => x !== d.f[k]));
        if (others.length < 2) return;
        out.push({ q: `«${noun(d)}» (${d.ru}) → ${lbl}`, opts: sh([d.f[k], others[0], others[1]]), ans: d.f[k], lvl });
      });
    });
    return out;
  }

  // значки тем
  const ICON = {
    read: "🔤", gender: "🚻", cases: "🧩", "decl-m": "♂️", "decl-f": "♀️", "decl-n": "⚪",
    "be-have": "✅", "verb-a": "🅰️", "verb-b": "🅱️", pronouns: "👤", possessive: "🫳",
    adjectives: "🎨", "neg-q": "❓", prepositions: "📍", numbers: "🔢", likes: "❤️",
    time: "🕒", imperative: "❗", future: "⏩", past: "⏪", na: "🔗", conj: "➕",
  };

  return {
    icon: (id) => ICON[id] || "•",
    has: (id) => !!gens[id],
    gen(id) { try { return gens[id] ? gens[id]() : []; } catch (e) { console.warn("ex gen", id, e); return []; } },
  };
})();

/* ============================================================
   SRS — интервальные повторения (упрощённый SM-2 + стрик)
   Всё хранится в localStorage. Ничего не уходит в сеть.
   ============================================================ */

const SRS_KEY = "greekA1_srs_v1";
const STATS_KEY = "greekA1_stats_v1";
const NEW_PER_DAY = 12; // сколько новых слов вводим в день по умолчанию

const SRS = {
  data: {},   // id -> { reps, interval, ease, due, lapses }
  stats: {},  // { streak, lastDay, learnedDates: {date: count}, totalReviews }

  load() {
    try { this.data = JSON.parse(localStorage.getItem(SRS_KEY)) || {}; }
    catch { this.data = {}; }
    try { this.stats = JSON.parse(localStorage.getItem(STATS_KEY)) || {}; }
    catch { this.stats = {}; }
    if (!this.stats.learnedDates) this.stats.learnedDates = {};
    if (!this.stats.totalReviews) this.stats.totalReviews = 0;
  },

  save() {
    localStorage.setItem(SRS_KEY, JSON.stringify(this.data));
    localStorage.setItem(STATS_KEY, JSON.stringify(this.stats));
    // Отправить в облако (если подключено и это не применение облачных данных)
    if (window.Cloud && window.Cloud.push && !window.Cloud._applying) window.Cloud.push();
  },

  today() {
    return new Date().toISOString().slice(0, 10);
  },

  // Карточка ещё не виделась
  isNew(id) {
    return !this.data[id];
  },

  // Карточки к повторению на сегодня (уже изученные, срок подошёл)
  dueCards(words) {
    const t = this.today();
    return words.filter((w) => {
      const c = this.data[w.id];
      return c && c.due <= t;
    });
  },

  // Новые карточки (с дневным лимитом)
  newCards(words, limit = NEW_PER_DAY) {
    const introducedToday = this.stats.learnedDates[this.today()] || 0;
    const remaining = Math.max(0, limit - introducedToday);
    return words.filter((w) => this.isNew(w.id)).slice(0, remaining);
  },

  // Очередь на сессию: сначала повторения, потом новые
  buildQueue(words, newLimit = NEW_PER_DAY) {
    return [...this.dueCards(words), ...this.newCards(words, newLimit)];
  },

  /* Оценка: 0 = не помню, 1 = трудно, 2 = хорошо, 3 = легко */
  grade(id, quality) {
    const t = this.today();
    let c = this.data[id];
    const wasNew = !c;
    if (!c) c = { reps: 0, interval: 0, ease: 2.5, lapses: 0 };

    if (quality === 0) {
      c.reps = 0;
      c.interval = 0;          // вернётся в эту же сессию / завтра
      c.lapses += 1;
      c.ease = Math.max(1.3, c.ease - 0.2);
    } else {
      c.reps += 1;
      if (c.reps === 1) c.interval = quality === 1 ? 1 : 1;
      else if (c.reps === 2) c.interval = quality === 1 ? 2 : 3;
      else c.interval = Math.round(c.interval * c.ease);

      // корректировка лёгкости
      if (quality === 1) c.ease = Math.max(1.3, c.ease - 0.15);
      else if (quality === 3) c.ease = c.ease + 0.1;

      if (quality === 1) c.interval = Math.max(1, Math.round(c.interval * 0.6));
      if (quality === 3) c.interval = Math.round(c.interval * 1.3);
    }

    c.interval = Math.max(0, c.interval);
    const due = new Date();
    due.setDate(due.getDate() + Math.max(c.interval, quality === 0 ? 0 : 1));
    c.due = due.toISOString().slice(0, 10);
    this.data[id] = c;

    // Статистика
    this.stats.totalReviews += 1;
    if (wasNew) {
      this.stats.learnedDates[t] = (this.stats.learnedDates[t] || 0) + 1;
    }
    this.touchStreak();
    this.save();
    return c;
  },

  // Обновление стрика (дни подряд с активностью)
  touchStreak() {
    const t = this.today();
    if (this.stats.lastDay === t) return;
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const y = yesterday.toISOString().slice(0, 10);
    if (this.stats.lastDay === y) this.stats.streak = (this.stats.streak || 0) + 1;
    else this.stats.streak = 1;
    this.stats.lastDay = t;
  },

  // Сводка прогресса
  summary(words) {
    let learned = 0, mature = 0;
    words.forEach((w) => {
      const c = this.data[w.id];
      if (c) {
        learned++;
        if (c.interval >= 7) mature++;
      }
    });
    return {
      total: words.length,
      learned,
      mature,
      due: this.dueCards(words).length,
      newToday: this.stats.learnedDates[this.today()] || 0,
      streak: this.stats.streak || 0,
      totalReviews: this.stats.totalReviews || 0,
    };
  },

  reset() {
    localStorage.removeItem(SRS_KEY);
    localStorage.removeItem(STATS_KEY);
    this.data = {};
    this.stats = { learnedDates: {}, totalReviews: 0 };
  },
};

SRS.load();

/* ============================================================
   Озвучка греческого через Web Speech API (SpeechSynthesis).
   Работает офлайн в большинстве браузеров. Если греческого
   голоса нет — мягко деградируем (кнопка просто молчит).
   ============================================================ */

const Speech = {
  voice: null,
  ready: false,
  supported: typeof window !== "undefined" && "speechSynthesis" in window,

  init() {
    if (!this.supported) return;
    const pick = () => {
      const voices = window.speechSynthesis.getVoices();
      // Ищем греческий голос (el-GR / el)
      this.voice =
        voices.find((v) => /^el(-|_|$)/i.test(v.lang)) ||
        voices.find((v) => /greek/i.test(v.name)) ||
        null;
      this.ready = voices.length > 0;
    };
    pick();
    // Голоса часто грузятся асинхронно
    window.speechSynthesis.onvoiceschanged = pick;
  },

  hasGreek() {
    return this.supported && !!this.voice;
  },

  // Произнести греческий текст. rate < 1 = медленнее.
  say(text, rate = 0.9) {
    if (!this.supported) return false;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "el-GR";
    if (this.voice) u.voice = this.voice;
    u.rate = rate;
    u.pitch = 1;
    window.speechSynthesis.speak(u);
    return true;
  },

  // Озвучить несколько фраз подряд (для чтения «озвучить всё»)
  sayAll(texts, rate = 0.9) {
    if (!this.supported) return false;
    window.speechSynthesis.cancel();
    texts.forEach((text) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "el-GR";
      if (this.voice) u.voice = this.voice;
      u.rate = rate;
      window.speechSynthesis.speak(u);
    });
    return true;
  },

  stop() {
    if (this.supported) window.speechSynthesis.cancel();
  },
};

Speech.init();

/* ============================================================
   Распознавание речи (SpeechRecognition).
   Работает в Chrome/Edge и Android Chrome (нужен HTTPS + микрофон).
   В Safari/iOS не поддерживается — Recog.supported === false.
   ============================================================ */
const Recog = {
  SR: typeof window !== "undefined" ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null,
  get supported() { return !!this.SR; },
  busy: false,

  // onResult(alternatives[]), onError(code), onStart()
  listen(onResult, onError, onStart) {
    if (!this.SR) { onError && onError("unsupported"); return; }
    if (this.busy) return;
    this.busy = true;
    let rec;
    try { rec = new this.SR(); }
    catch (e) { this.busy = false; onError && onError("init"); return; }
    rec.lang = "el-GR";
    rec.interimResults = false;
    rec.maxAlternatives = 5;
    let got = false;
    rec.onstart = () => onStart && onStart();
    rec.onresult = (ev) => {
      got = true;
      const res = ev.results[0];
      const alts = [];
      for (let i = 0; i < res.length; i++) alts.push(res[i].transcript);
      onResult && onResult(alts);
    };
    rec.onerror = (ev) => { this.busy = false; onError && onError(ev.error || "error"); };
    rec.onend = () => { this.busy = false; if (!got) onError && onError("nomatch"); };
    try { rec.start(); }
    catch (e) { this.busy = false; onError && onError("start"); }
  },
};

/* ============================================================
   Ελληνικά A1 — главный контроллер приложения.
   Без зависимостей. Рендер строками + делегирование событий.
   ============================================================ */

const App = {
  view: "home",
  params: {},
  session: null,

  root: null,

  init() {
    this.root = document.getElementById("app");
    // Service worker: «никогда не залипает на старой версии» (только на https-сайте).
    // network-first отдаёт свежее из сети; при выходе новой версии — тихий reload.
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      const hadController = !!navigator.serviceWorker.controller;
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloaded || !hadController) return; // не перезагружаем при самой первой установке
        reloaded = true;
        location.reload();
      });
      navigator.serviceWorker.register("sw.js").then((reg) => { reg.update(); }).catch(() => {});
    }
    document.body.addEventListener("click", (e) => this.onClick(e));
    document.body.addEventListener("input", (e) => this.onInput(e));
    document.body.addEventListener("keydown", (e) => this.onKey(e));
    window.addEventListener("hashchange", () => this.onHashChange());
    // Стартуем с того экрана, что в URL (устойчиво к F5)
    const { view, params } = this.readHash();
    this.view = view;
    this.params = params;
    this.render();
  },

  go(view, params = {}) {
    this.view = view;
    this.params = params;
    this.session = null;
    this.menuOpen = false;
    Speech.stop();
    this.writeHash();
    this.render();
    window.scrollTo(0, 0);
  },

  // URL <-> состояние экрана
  writeHash() {
    let h = "#" + this.view;
    const keys = Object.keys(this.params);
    if (keys.length) h += "?" + keys.map((k) => k + "=" + encodeURIComponent(this.params[k])).join("&");
    if (("#" + (location.hash.replace(/^#/, "") || "home")) !== ("#" + (h.replace(/^#/, "") || "home"))) {
      if (location.hash !== h) { this.suppressHash = true; location.hash = h; }
    }
  },

  readHash() {
    const raw = (location.hash || "").replace(/^#/, "");
    if (!raw) return { view: "home", params: {} };
    const [view, qs] = raw.split("?");
    const params = {};
    if (qs) qs.split("&").forEach((p) => { const [k, v] = p.split("="); if (k) params[k] = decodeURIComponent(v || ""); });
    return { view: view || "home", params };
  },

  // Назад/вперёд браузера и ручная правка URL
  onHashChange() {
    if (this.suppressHash) { this.suppressHash = false; return; }
    const { view, params } = this.readHash();
    this.view = view;
    this.params = params;
    this.session = null;
    this.menuOpen = false;
    Speech.stop();
    this.render();
    window.scrollTo(0, 0);
  },

  /* ---------- УТИЛИТЫ ---------- */
  shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  },

  // Сравнение греческого без учёта ударений/регистра (для набора)
  normGreek(s) {
    return (s || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "") // снять диакритику
      .replace(/ς/g, "σ")
      .replace(/[;.,!·]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  },

  // Фонетическая нормализация для голоса: омофоны → один звук.
  // Так «звучит верно» засчитывается даже при ином написании.
  phoneticGreek(s) {
    let x = this.normGreek(s);
    x = x
      .replace(/ει|οι|υι/g, "ι")   // ει/οι/υι звучат как «и»
      .replace(/αι/g, "ε")          // αι звучит как «э»
      .replace(/[ηυ]/g, "ι")        // η, υ → «и»
      .replace(/ω/g, "ο")           // ω → «о»
      .replace(/μπ/g, "б").replace(/ντ/g, "д") // звонкие сочетания
      .replace(/(.)\1+/g, "$1");    // двойные буквы → одна (σσ→σ)
    return x;
  },

  // Прокрутить блок обратной связи (с кнопкой «Дальше») в зону видимости
  afterAnswer() {
    requestAnimationFrame(() => {
      const fb = document.getElementById("fb");
      if (fb) fb.scrollIntoView({ behavior: "smooth", block: "end" });
    });
  },

  esc(s) {
    return (s || "").replace(/[&<>"]/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
    );
  },

  speakBtn(text, label = "🔊") {
    return `<button class="speak" data-say="${this.esc(text)}" title="Послушать">${label}</button>`;
  },

  /* ---------- РЕНДЕР ---------- */
  render() {
    const map = {
      home: () => this.renderHome(),
      alphabet: () => this.renderAlphabet(),
      alphaQuiz: () => this.renderAlphaQuiz(),
      review: () => this.renderReview(),
      decks: () => this.renderDecks(),
      practice: () => this.renderPractice(),
      grammar: () => this.renderGrammar(),
      lesson: () => this.renderLesson(),
      trainer: () => this.renderTrainer(),
      gex: () => this.renderGex(),
      writing: () => this.renderWriting(),
      speaking: () => this.renderSpeaking(),
      reading: () => this.renderReadingList(),
      read: () => this.renderRead(),
      exams: () => this.renderExamsList(),
      exam: () => this.renderExam(),
      progress: () => this.renderProgress(),
      coverage: () => this.renderCoverage(),
    };
    this.root.innerHTML =
      this.renderNav() + `<main class="screen">${(map[this.view] || map.home)()}</main>` + this.wordbarHtml();
    if (this.afterRender) { const f = this.afterRender; this.afterRender = null; f(); }
  },

  // Глобальная панель перевода слова (тап по любому греческому слову)
  wordbarHtml() {
    return `<div id="wordbar" class="wordbar" hidden>
      <button class="wb-spk" data-say="">🔊</button>
      <div class="wb-body"><span class="wb-gr"></span><span class="wb-ru"></span></div>
      <button class="wb-x" data-action="wordbar-close">✕</button>
    </div>`;
  },
  // Общий словарь для тап-перевода (слова + общие + глоссарии чтения + формы)
  globalGloss() {
    if (this._gg) return this._gg;
    const g = {};
    ALL_WORDS.forEach((w) => { const k = this.normGreek(w.gr); if (k && !k.includes(" ")) g[k] = w.ru; });
    if (typeof READING_COMMON !== "undefined") Object.entries(READING_COMMON).forEach(([k, v]) => { g[this.normGreek(k)] = v; });
    if (typeof READING_TEXTS !== "undefined") READING_TEXTS.forEach((t) => Object.entries(t.gloss || {}).forEach(([k, v]) => { const nk = this.normGreek(k); if (!g[nk]) g[nk] = v; }));
    if (typeof DECLENSIONS !== "undefined") DECLENSIONS.forEach((d) => Object.values(d.f).forEach((f) => f.split(" ").forEach((tok) => { const nk = this.normGreek(tok); if (nk && !g[nk]) g[nk] = d.ru; })));
    if (typeof CONJUGATIONS !== "undefined") CONJUGATIONS.forEach((v) => Object.values(v.f).forEach((f) => { const nk = this.normGreek(f); if (!g[nk]) g[nk] = v.ru; }));
    this._gg = g;
    return g;
  },
  // Обернуть греческие слова в тап-спаны (для теории/упражнений)
  wrapGreek(html) {
    return (html || "").replace(/[Ͱ-Ͽἀ-῿]+/g, (m) =>
      `<span class="rword" data-rw="${this.esc(this.normGreek(m))}" data-ro="${this.esc(m)}">${m}</span>`);
  },

  /* ---------- АЛФАВИТ ---------- */
  renderAlphabet() {
    const letters = ALPHABET.map(
      (l) => `
      <button class="letter" data-say="${l.lower.replace('/ς','')}, ${l.example}">
        <div class="letter-glyph">${l.upper} ${l.lower}</div>
        <div class="letter-name">${l.name}</div>
        <div class="letter-sound">${l.sound}</div>
        <div class="letter-ex">${l.example} — ${l.exTr}</div>
      </button>`
    ).join("");

    const digs = DIGRAPHS.map(
      (d) => `
      <button class="letter dig" data-say="${d.example}">
        <div class="letter-glyph">${d.gr}</div>
        <div class="letter-sound">${d.translit} · ${d.note}</div>
        <div class="letter-ex">${d.example} — ${d.exTr}</div>
      </button>`
    ).join("");

    return `
      <header class="page-head">
        <h2>🔤 Греческий алфавит</h2>
        <button class="big-btn primary slim" data-go="alphaQuiz">▶ Тренировать буквы</button>
      </header>
      <p class="muted">24 буквы. Нажми на букву — услышишь название и пример. Сначала выучи узнавание, потом переходи к тренажёру.</p>
      <div class="letter-grid">${letters}</div>

      <h3 class="section-title">Буквосочетания (обязательно!)</h3>
      <p class="muted">Без них слова читаются неправильно. Например, <b>ου</b> = «у», а <b>μπ</b> в начале = «б».</p>
      <div class="letter-grid">${digs}</div>
    `;
  },

  /* ---------- ТРЕНАЖЁР БУКВ ---------- */
  renderAlphaQuiz() {
    if (!this.session) {
      const pool = this.shuffle(ALPHABET).slice(0, 10);
      this.session = { pool, idx: 0, correct: 0, answered: false };
    }
    const s = this.session;
    if (s.idx >= s.pool.length) {
      return `
        <div class="result">
          <h2>Готово! 🎉</h2>
          <p class="big-score">${s.correct} / ${s.pool.length}</p>
          <p class="muted">правильных ответов по буквам</p>
          <button class="big-btn primary" data-action="alpha-again">Ещё раунд</button>
          <button class="big-btn ghost" data-go="alphabet">К алфавиту</button>
        </div>`;
    }
    const cur = s.pool[s.idx];
    // Варианты: какой звук/название у этой буквы (выбор из 4)
    const options = this.shuffle([
      cur,
      ...this.shuffle(ALPHABET.filter((l) => l.upper !== cur.upper)).slice(0, 3),
    ]);
    const opts = options
      .map(
        (o) =>
          `<button class="opt" data-alpha-opt="${o.upper}">${o.sound} <small>· ${o.example}</small></button>`
      )
      .join("");
    return `
      <header class="page-head"><h2>Буква → звук</h2><div class="counter">${s.idx + 1}/${s.pool.length}</div></header>
      <div class="quiz-prompt compact">
        <div class="big-letter">${cur.upper} ${cur.lower}</div>
        <div class="muted small">${cur.name} ${this.speakBtn(cur.example)}</div>
      </div>
      <p class="muted center small q-ask">Какой это звук?</p>
      <div class="opts">${opts}</div>
      <div id="fb" class="feedback"></div>
    `;
  },

  /* ---------- ПОВТОРЕНИЕ (SRS) ---------- */
  renderReview() {
    if (!this.session) {
      const queue = SRS.buildQueue(ALL_WORDS, 12);
      this.session = { queue, idx: 0, flipped: false, done: 0, again: [] };
    }
    const s = this.session;
    // Если основная очередь кончилась, добиваем "не помню"
    let cur = s.queue[s.idx];
    if (!cur && s.again.length) { s.queue = s.again; s.again = []; s.idx = 0; cur = s.queue[0]; }

    if (!cur) {
      const sum = SRS.summary(ALL_WORDS);
      return `
        <div class="result">
          <h2>Сессия завершена 👏</h2>
          <p class="muted">Повторено карточек: <b>${s.done}</b></p>
          <p class="muted">Стрик: <b>${sum.streak} 🔥</b> · Всего изучается: <b>${sum.learned}/${sum.total}</b></p>
          <button class="big-btn primary" data-action="review-again">Продолжить</button>
          <button class="big-btn ghost" data-go="decks">Тренировать темы</button>
        </div>`;
    }
    const isNew = SRS.isNew(cur.id);
    const front = `
      <div class="card-tag">${isNew ? "🆕 новое слово" : "🔁 повторение"} · ${cur.deckTitle}</div>
      <div class="flash-gr">${cur.gr} ${this.speakBtn(cur.gr)}</div>
      <div class="flash-tr">[${cur.tr}]</div>`;
    const back = s.flipped
      ? `<div class="flash-ru">${cur.ru}</div>`
      : `<button class="reveal" data-action="flip">Показать перевод</button>`;
    const controls = s.flipped
      ? `<div class="grades">
          <button class="grade g0" data-grade="0">Не помню<small>снова</small></button>
          <button class="grade g1" data-grade="1">Трудно<small>скоро</small></button>
          <button class="grade g2" data-grade="2">Хорошо<small>+дни</small></button>
          <button class="grade g3" data-grade="3">Легко<small>+нед.</small></button>
        </div>`
      : "";
    return `
      <header class="page-head"><h2>🧠 Повторение</h2><div class="counter">осталось ${s.queue.length - s.idx + s.again.length}</div></header>
      <div class="flashcard">${front}${back}</div>
      ${controls}
      <p class="muted center small">Оцени честно: чем хуже помнишь — тем раньше слово вернётся.</p>
    `;
  },

  /* ---------- СПИСОК ТЕМ ---------- */
  renderDecks() {
    const tiles = DECKS.map((d) => {
      const sum = SRS.summary(d.words);
      const pct = Math.round((sum.learned / sum.total) * 100);
      return `
        <button class="deck-tile" data-deck="${d.id}">
          <div class="deck-ic">${d.icon}</div>
          <div class="deck-body">
            <div class="deck-title">${d.title}</div>
            <div class="deck-meta">${d.words.length} слов · освоено ${pct}%</div>
            <div class="progress-bar mini"><div class="progress-fill" style="width:${pct}%"></div></div>
          </div>
        </button>`;
    }).join("");
    return `
      <header class="page-head"><h2>📚 Темы</h2></header>
      <p class="muted">Бытовые темы экзамена A2. Выбери тему — внутри слова, аудирование, выбор и набор.</p>
      <div class="deck-list">${tiles}</div>
    `;
  },

  /* ---------- ТЕМА: ПРОСМОТР + РЕЖИМЫ ---------- */
  renderPractice() {
    const deck = DECKS.find((d) => d.id === this.params.deck);
    if (!deck) return this.renderDecks();
    const mode = this.params.mode || "list";

    if (mode === "list") {
      const rows = deck.words
        .map(
          (w) => `
        <div class="word-row">
          <span class="w-audio">${this.speakBtn(w.gr)}</span>
          <div class="w-gr">${w.gr}</div>
          <div class="w-tr">[${w.tr}]</div>
          <div class="w-ru">${w.ru}</div>
        </div>`
        )
        .join("");
      return `
        <header class="page-head"><h2>${deck.icon} ${deck.title}</h2><button class="back" data-go="decks">← Темы</button></header>
        <div class="mode-row">
          <button class="mode-btn" data-mode="learn"><span>🧠</span>Карточки</button>
          <button class="mode-btn" data-mode="choice"><span>✅</span>Выбор</button>
          <button class="mode-btn" data-mode="listen"><span>👂</span>Аудио</button>
          <button class="mode-btn" data-mode="type"><span>⌨️</span>Набор</button>
          <button class="mode-btn hot" data-mode="dictation"><span>🎧</span>Диктант</button>
          <button class="mode-btn hot" data-mode="speak"><span>🎤</span>Голос</button>
        </div>
        <div class="word-list">${rows}</div>
      `;
    }
    return this.renderDeckMode(deck, mode);
  },

  renderDeckMode(deck, mode) {
    if (!this.session) {
      this.session = { pool: this.shuffle(deck.words), idx: 0, correct: 0, answered: false, input: "" };
    }
    const s = this.session;
    const titleByMode = { learn: "🧠 Карточки", choice: "✅ Выбор перевода", listen: "👂 Аудирование", type: "⌨️ Набор по-гречески", dictation: "🎧 Диктант (на слух)", speak: "🎤 Произношение" };

    if (s.idx >= s.pool.length) {
      return `
        <div class="result">
          <h2>Тема пройдена! 🎉</h2>
          <p class="big-score">${s.correct} / ${s.pool.length}</p>
          <button class="big-btn primary" data-action="mode-again">Ещё раз</button>
          <button class="big-btn ghost" data-deck="${deck.id}" data-mode="list">К теме</button>
          <button class="big-btn ghost" data-go="decks">Все темы</button>
        </div>`;
    }
    const cur = s.pool[s.idx];
    const head = `<header class="page-head"><h2>${titleByMode[mode]}</h2><div class="counter">${s.idx + 1}/${s.pool.length}</div></header>`;

    if (mode === "learn") {
      const body = s.answered
        ? `<div class="flash-ru">${cur.ru}</div>
           <div class="grades simple">
             <button class="grade g0" data-deck-next="0">Не знал</button>
             <button class="grade g2" data-deck-next="1">Знал</button>
           </div>`
        : `<button class="reveal" data-action="deck-flip">Показать перевод</button>`;
      return `${head}
        <div class="flashcard">
          <div class="card-tag">${deck.title}</div>
          <div class="flash-gr">${cur.gr} ${this.speakBtn(cur.gr)}</div>
          <div class="flash-tr">[${cur.tr}]</div>
          ${body}
        </div>`;
    }

    if (mode === "choice" || mode === "listen") {
      const opts = this.shuffle([
        cur,
        ...this.shuffle(deck.words.filter((w) => w.id !== cur.id)).slice(0, 3),
      ]);
      const prompt =
        mode === "listen"
          ? `<div class="quiz-prompt listen">
               <button class="play-big" data-say="${this.esc(cur.gr)}">🔊 Слушать</button>
               <button class="play-slow" data-say-slow="${this.esc(cur.gr)}">🐢 Медленно</button>
             </div>
             <p class="muted center">Что ты услышал?</p>`
          : `<div class="quiz-prompt">
               <div class="big-letter sm">${cur.gr} ${this.speakBtn(cur.gr)}</div>
               <div class="muted">[${cur.tr}]</div>
             </div>
             <p class="muted center">Выбери перевод</p>`;
      const buttons = opts
        .map((o) => `<button class="opt" data-choice="${o.id}">${o.ru}</button>`)
        .join("");
      this.afterRender = mode === "listen" ? () => Speech.say(cur.gr) : null;
      return `${head}${prompt}<div class="opts">${buttons}</div><div id="fb" class="feedback"></div>`;
    }

    if (mode === "speak") {
      const ok = Recog.supported;
      const body = ok
        ? `<button class="mic-btn" data-action="speak-start">🎤 Произнести</button>
           <p class="muted center small">Нажми и чётко скажи слово вслух. Браузер спросит доступ к микрофону — разреши.</p>`
        : `<div class="banner">🎤 Распознавание речи не поддерживается этим браузером (на iPhone его нет). Открой сайт в <b>Chrome</b> на Android или компьютере. Пока можешь слушать образец и повторять вслух.</div>
           <button class="big-btn primary" data-action="speak-next">Дальше →</button>`;
      return `${head}
        <div class="quiz-prompt">
          <div class="big-letter sm">${cur.gr} ${this.speakBtn(cur.gr)}</div>
          <div class="muted">[${cur.tr}] · ${cur.ru}</div>
        </div>
        ${body}
        <div id="fb" class="feedback"></div>`;
    }

    if (mode === "type" || mode === "dictation") {
      const prompt =
        mode === "dictation"
          ? `<div class="quiz-prompt listen">
               <button class="play-big" data-say="${this.esc(cur.gr)}">🔊 Повторить</button>
               <button class="play-slow" data-say-slow="${this.esc(cur.gr)}">🐢 Медленно</button>
               <div class="muted small dict-hint">Слушай и запиши по-гречески</div>
             </div>`
          : `<div class="quiz-prompt">
               <div class="type-ru">${cur.ru}</div>
               <div class="muted small">подсказка: [${cur.tr}]</div>
             </div>`;
      // В диктанте звук проигрывается сам при показе карточки
      this.afterRender = () => {
        if (mode === "dictation") Speech.say(cur.gr);
        const i = document.getElementById("typeInput");
        if (i) i.focus();
      };
      return `${head}
        ${prompt}
        <input id="typeInput" class="type-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="Напиши по-гречески (ударения можно не ставить)" value="${this.esc(s.input)}">
        <div class="kbd-hint">Нужны греческие буквы? Включи раскладку Ελληνικά или используй экранную клавиатуру ниже.</div>
        <div class="gkbd">${this.greekKeyboard()}</div>
        <button class="big-btn primary" data-action="type-check">Проверить</button>
        <div id="fb" class="feedback"></div>`;
    }
    return this.renderDecks();
  },

  greekKeyboard() {
    const rows = ["ασδφγηξκλ", "ζχψωβνμ", "ερτυθιοπ"];
    return rows
      .map(
        (r) =>
          `<div class="gkbd-row">${r
            .split("")
            .map((c) => `<button class="gkey" data-key="${c}">${c}</button>`)
            .join("")}<button class="gkey wide" data-key=" ">␣</button><button class="gkey wide" data-key="BACK">⌫</button></div>`
      )
      .join("");
  },

  /* ---------- ГРАММАТИКА: список тем → полная страница урока ---------- */
  renderGrammar() {
    const rows = GRAMMAR_LESSONS.map((g) => {
      const n = GrammarEx.has(g.id) ? GrammarEx.gen(g.id).length : 0;
      return `<button class="lesson-row" data-lesson="${g.id}">
        <span class="lesson-ic">${GrammarEx.icon(g.id)}</span>
        <span class="lesson-ttl">${g.title}</span>
        ${n ? `<span class="lesson-n">${n} упр.</span>` : ""}
        <span class="lesson-arr">›</span>
      </button>`;
    }).join("");
    return `
      <header class="page-head"><h2>📖 Грамматика A1</h2></header>
      <p class="muted">Выбери тему — полное объяснение с примерами и упражнения. Любое греческое слово можно тапнуть для перевода.</p>
      <div class="lesson-list">${rows}</div>
    `;
  },

  renderLesson() {
    const i = GRAMMAR_LESSONS.findIndex((g) => g.id === this.params.id);
    const g = GRAMMAR_LESSONS[i];
    if (!g) return this.renderGrammar();
    const n = GrammarEx.has(g.id) ? GrammarEx.gen(g.id).length : 0;
    const next = GRAMMAR_LESSONS[i + 1];
    return `
      <header class="page-head"><h2>${GrammarEx.icon(g.id)} ${g.title}</h2><button class="back" data-go="grammar">← Темы</button></header>
      <article class="lesson">${this.wrapGreek(g.body)}</article>
      <div class="lesson-actions">
        ${n ? `<button class="big-btn primary" data-gex="${g.id}">▶ Упражнения (${n})</button>` : ""}
        ${next ? `<button class="big-btn ghost" data-lesson="${next.id}">Дальше: ${next.title.replace(/^\d+\.\s*/, "")} →</button>` : `<button class="big-btn ghost" data-go="grammar">К списку тем</button>`}
      </div>
    `;
  },

  /* ---------- ТРЕНАЖЁР ФОРМ (склонения / спряжения) ---------- */
  renderTrainer() {
    const kind = this.params.kind || "decl";
    const isDecl = kind === "decl";
    const data = isDecl ? DECLENSIONS : CONJUGATIONS;
    const slots = isDecl ? DECL_CASES : CONJ_PERSONS;
    // Для спряжений не спрашиваем словарную форму (s1 = εγώ)
    const askable = isDecl ? slots : slots.filter((s) => s.key !== "s1");

    if (!this.session) {
      const tasks = this.shuffle(data).slice(0, 16).map((entry) => {
        const slot = askable[Math.floor(Math.random() * askable.length)];
        return { entry, slot };
      });
      this.session = { kind, tasks, idx: 0, correct: 0 };
    }
    const s = this.session;
    const title = isDecl ? "🧩 Тренажёр склонений" : "🔀 Тренажёр спряжений";

    if (s.idx >= s.tasks.length) {
      return `
        <div class="result">
          <h2>Готово! 🎉</h2>
          <p class="big-score">${s.correct} / ${s.tasks.length}</p>
          <p class="muted">${isDecl ? "правильных форм по падежам" : "правильных форм глаголов"}</p>
          <button class="big-btn primary" data-action="trainer-again">Ещё раунд</button>
          <button class="big-btn ghost" data-go="grammar">К грамматике</button>
        </div>`;
    }
    const { entry, slot } = s.tasks[s.idx];
    const correct = entry.f[slot.key];
    // Варианты из других форм этого же слова (учим различать формы)
    const pool = [...new Set(Object.values(entry.f))].filter((v) => v !== correct);
    const options = this.shuffle([correct, ...this.shuffle(pool).slice(0, 3)]);

    const promptTop = isDecl
      ? `Поставь <b>«${entry.word}»</b> (${entry.ru}, ${entry.g} род, тип ${entry.pat}) в форму:`
      : `Проспрягай <b>«${entry.word}»</b> (${entry.ru}, группа «${entry.grp}») для лица:`;

    const opts = options
      .map((o) => `<button class="opt" data-form="${this.esc(o)}">${o} ${this.speakBtn(o)}</button>`)
      .join("");

    return `
      <header class="page-head"><h2>${title}</h2><div class="counter">${s.idx + 1}/${s.tasks.length}</div></header>
      <div class="quiz-prompt">
        <div class="muted small">${promptTop}</div>
        <div class="slot-target">${slot.label}</div>
        <div class="muted small">${slot.hint}</div>
      </div>
      <div class="opts">${opts}</div>
      <div id="fb" class="feedback"></div>
    `;
  },

  /* ---------- УПРАЖНЕНИЯ ПО ТЕМЕ ГРАММАТИКИ ---------- */
  renderGex() {
    const id = this.params.topic;
    const lesson = GRAMMAR_LESSONS.find((g) => g.id === id);
    if (!this.session) {
      const all = GrammarEx.gen(id);
      const byLvl = {};
      all.forEach((x) => { const l = x.lvl || 1; (byLvl[l] = byLvl[l] || []).push(x); });
      let ordered = [];
      Object.keys(byLvl).sort().forEach((l) => ordered = ordered.concat(this.shuffle(byLvl[l])));
      this.session = { id, qs: ordered.slice(0, 24), idx: 0, correct: 0 };
    }
    const s = this.session;
    const title = (lesson ? lesson.title.replace(/^\d+\.\s*/, "") : "Упражнения");
    if (s.idx >= s.qs.length) {
      const pct = s.qs.length ? Math.round((100 * s.correct) / s.qs.length) : 0;
      return `<div class="result"><h2>${pct >= 80 ? "Отлично! 🎉" : "Готово 💪"}</h2>
        <p class="big-score ${pct < 60 ? "fail" : ""}">${s.correct} / ${s.qs.length}</p>
        <button class="big-btn primary" data-gex="${s.id}">Ещё раунд</button>
        <button class="big-btn ghost" data-go="grammar">К грамматике</button></div>`;
    }
    if (!s.qs.length) return `<div class="result"><h2>Скоро</h2><p class="muted">Для этой темы упражнения готовятся.</p><button class="big-btn ghost" data-go="grammar">Назад</button></div>`;
    const q = s.qs[s.idx];
    const opts = q.opts.map((o) => `<button class="opt" data-gexopt="${this.esc(o)}">${o}</button>`).join("");
    return `
      <header class="page-head"><h2>${GrammarEx.icon(s.id)} ${title}</h2><div class="counter">${s.idx + 1}/${s.qs.length}</div></header>
      <button class="back" data-go="grammar">← Грамматика</button>
      <div class="exam-q">${this.wrapGreek(q.q)}</div>
      <div class="opts">${opts}</div>
      <div id="fb" class="feedback"></div>`;
  },

  gexAnswer(opt, el) {
    const s = this.session;
    const q = s.qs[s.idx];
    const ok = opt === q.ans;
    if (ok) s.correct++;
    document.querySelectorAll(".opt").forEach((b) => {
      if (b.dataset.gexopt === q.ans) b.classList.add("ok");
      else if (b === el) b.classList.add("bad");
      b.disabled = true;
    });
    const fb = document.getElementById("fb");
    fb.innerHTML = `<div class="${ok ? "ok-msg" : "bad-msg"}">${ok ? "✓ Верно!" : "✗ Правильно: <b>" + q.ans + "</b>"} ${this.speakBtn(q.ans)}</div>
      <button class="big-btn primary" id="nextBtn">${s.idx + 1 >= s.qs.length ? "Результат →" : "Дальше →"}</button>`;
    Speech.say(q.ans);
    fb.querySelector("#nextBtn").addEventListener("click", () => { s.idx++; this.render(); });
    this.afterAnswer();
  },

  /* ---------- ПИСЬМО (авто-упражнения) ---------- */
  renderWriting() {
    const mode = this.params.mode || "menu";
    if (mode === "menu") {
      const tile = (m, ic, t, d) =>
        `<button class="deck-tile" data-wmode="${m}"><div class="deck-ic">${ic}</div><div class="deck-body"><div class="deck-title">${t}</div><div class="deck-meta">${d}</div></div></button>`;
      return `
        <header class="page-head"><h2>✍️ Письмо</h2></header>
        <p class="muted">Письменные упражнения A1 — проверяются автоматически.</p>
        <div class="deck-list">
          ${tile("worder", "🧩", "Собери предложение", "порядок слов из блоков")}
          ${tile("gap", "✏️", "Вставь слово", "пропущенное слово · грамматика")}
          ${tile("compose", "📝", "Текст из слов", "составь предложения из изученных слов")}
          ${tile("self", "🪪", "О себе", "ответь по-гречески, сверься с образцом")}
        </div>`;
    }
    if (mode === "worder") return this.renderWOrder();
    if (mode === "gap") return this.renderWGap();
    if (mode === "compose") return this.renderWCompose();
    if (mode === "self") return this.renderWSelf();
    return this.renderWriting();
  },

  wHead(title, s) {
    return `<header class="page-head"><h2>${title}</h2><div class="counter">${Math.min(s.idx + 1, s.pool.length)}/${s.pool.length}</div></header>
      <button class="back" data-go="writing">← Письмо</button>`;
  },

  wResult(s, label) {
    return `<div class="result">
      <h2>Готово! 🎉</h2><p class="big-score">${s.correct} / ${s.pool.length}</p>
      <p class="muted">${label}</p>
      <button class="big-btn primary" data-action="wr-again">Ещё раунд</button>
      <button class="big-btn ghost" data-go="writing">К письму</button>
    </div>`;
  },

  // Собери предложение (порядок слов)
  renderWOrder() {
    if (!this.session) this.session = { pool: this.shuffle(WRITING_ORDER), idx: 0, correct: 0, bank: null, built: [] };
    const s = this.session;
    if (s.idx >= s.pool.length) return this.wResult(s, "верных предложений");
    const cur = s.pool[s.idx];
    if (s.bank === null) { s.bank = this.shuffle(cur.tokens.map((t, i) => ({ i, t }))); s.built = []; }
    // Канонически первый токен показываем со строчной буквы, чтобы заглавная
    // не выдавала его позицию (проверка регистронезависимая).
    const disp = (i) => i === 0 ? cur.tokens[i].charAt(0).toLowerCase() + cur.tokens[i].slice(1) : cur.tokens[i];
    const builtHtml = s.built.length
      ? s.built.map((i) => `<button class="tok built" data-wtoken="built:${i}">${disp(i)}</button>`).join("")
      : `<span class="muted small">нажимай слова ниже, чтобы собрать фразу…</span>`;
    const bankHtml = s.bank.filter((b) => !s.built.includes(b.i))
      .map((b) => `<button class="tok" data-wtoken="bank:${b.i}">${disp(b.i)}</button>`).join("");
    return `${this.wHead("🧩 Собери предложение", s)}
      <div class="quiz-prompt"><div class="type-ru">${cur.ru}</div></div>
      <div class="build-area">${builtHtml}</div>
      <div class="bank-area">${bankHtml}</div>
      <button class="big-btn primary" data-action="worder-check">Проверить</button>
      <div id="fb" class="feedback"></div>`;
  },

  wToken(spec) {
    const s = this.session;
    const [kind, iStr] = spec.split(":");
    const i = parseInt(iStr, 10);
    if (kind === "bank") s.built.push(i);
    else s.built = s.built.filter((x) => x !== i);
    this.render();
  },

  worderCheck() {
    const s = this.session;
    const cur = s.pool[s.idx];
    const built = s.built.map((i) => cur.tokens[i]).join(" ");
    const ok = this.normGreek(built) === this.normGreek(cur.tokens.join(" "));
    if (ok && !s._scored) s.correct++;
    s._scored = true;
    const right = cur.tokens.join(" ");
    const fb = document.getElementById("fb");
    fb.innerHTML = `<div class="${ok ? "ok-msg" : "bad-msg"}">${ok ? "✓ Верно! " + right : "✗ Правильно: <b>" + right + "</b>"} ${this.speakBtn(right)}</div>
      <button class="big-btn primary" id="nextBtn">Дальше →</button>`;
    Speech.say(right);
    fb.querySelector("#nextBtn").addEventListener("click", () => { s.idx++; s.bank = null; s.built = []; s._scored = false; this.render(); });
    this.afterAnswer();
  },

  // Вставь слово
  renderWGap() {
    if (!this.session) this.session = { pool: this.shuffle(WRITING_GAPS), idx: 0, correct: 0 };
    const s = this.session;
    if (s.idx >= s.pool.length) return this.wResult(s, "верных ответов");
    const cur = s.pool[s.idx];
    const opts = this.shuffle(cur.options).map((o) => `<button class="opt" data-wgap="${this.esc(o)}">${o}</button>`).join("");
    return `${this.wHead("✏️ Вставь слово", s)}
      <div class="quiz-prompt">
        <div class="gap-sentence">${cur.parts[0]}<span class="blank">_____</span>${cur.parts[1]}</div>
        <div class="muted small">${cur.ru}</div>
      </div>
      <div class="opts">${opts}</div>
      <div id="fb" class="feedback"></div>`;
  },

  wGapAnswer(opt, el) {
    const s = this.session;
    const cur = s.pool[s.idx];
    const ok = opt === cur.answer;
    if (ok) s.correct++;
    document.querySelectorAll(".opt").forEach((b) => {
      if (b.dataset.wgap === cur.answer) b.classList.add("ok");
      else if (b === el) b.classList.add("bad");
      b.disabled = true;
    });
    const full = cur.parts[0] + cur.answer + cur.parts[1];
    const fb = document.getElementById("fb");
    fb.innerHTML = `<div class="${ok ? "ok-msg" : "bad-msg"}">${ok ? "✓ Верно!" : "✗ " + cur.answer} ${this.speakBtn(full)}<div class="answer-ru">${full}</div></div>
      <button class="big-btn primary" id="nextBtn">Дальше →</button>`;
    Speech.say(full);
    fb.querySelector("#nextBtn").addEventListener("click", () => { s.idx++; this.render(); });
    this.afterAnswer();
  },

  // Текст из изученных слов
  renderWCompose() {
    if (!this.session) {
      const learned = ALL_WORDS.filter((w) => !SRS.isNew(w.id) && /^[Α-Ωα-ωΆ-Ώά-ώ]+$/.test(w.gr)).map((w) => w.gr);
      const src = learned.length >= 5 ? learned : WRITING_STARTER_WORDS;
      this.session = { targets: this.shuffle(src).slice(0, 5), text: "" };
    }
    const s = this.session;
    const chips = s.targets.map((t) => `<span class="chip" id="chip-${this.esc(t)}">${t} ${this.speakBtn(t)}</span>`).join("");
    return `
      <header class="page-head"><h2>📝 Текст из слов</h2></header>
      <button class="back" data-go="writing">← Письмо</button>
      <p class="muted">Напиши 2–3 предложения по-гречески, используя <b>все</b> эти слова:</p>
      <div class="chips">${chips}</div>
      <textarea id="composeText" class="type-input area" placeholder="Πιши здесь…">${this.esc(s.text)}</textarea>
      <button class="big-btn primary" data-action="compose-check">Проверить</button>
      <button class="big-btn ghost" data-action="compose-new">Другие слова</button>
      <div id="fb" class="feedback"></div>`;
  },

  composeCheck() {
    const s = this.session;
    const inp = document.getElementById("composeText");
    const text = inp ? inp.value : "";
    s.text = text;
    const norm = this.normGreek(text);
    const used = [], missing = [];
    s.targets.forEach((t) => {
      const nt = this.normGreek(t);
      const stem = nt.slice(0, Math.max(4, nt.length - 2));
      (norm.includes(stem) ? used : missing).push(t);
    });
    s.targets.forEach((t) => {
      const chip = document.getElementById("chip-" + t);
      if (chip) chip.classList.toggle("done", used.includes(t));
    });
    const allUsed = missing.length === 0;
    const hasText = norm.length > 3;
    const fb = document.getElementById("fb");
    fb.innerHTML = allUsed && hasText
      ? `<div class="ok-msg">✓ Отлично! Использованы все ${used.length} слов(а). Так держать!</div>`
      : `<div class="bad-msg">Использовано ${used.length}/${s.targets.length}. Осталось вставить: <b>${missing.join(", ") || "—"}</b>${hasText ? "" : " (и напиши хоть пару слов)"}</div>`;
    this.afterAnswer();
  },

  // О себе (подсказка + образец)
  renderWSelf() {
    if (!this.session) this.session = { pool: this.shuffle(WRITING_SELF), idx: 0, revealed: false, text: "" };
    const s = this.session;
    if (s.idx >= s.pool.length) return `<div class="result"><h2>Готово! 🎉</h2><p class="muted">Ты ответил на все вопросы о себе.</p><button class="big-btn primary" data-action="wr-again">Ещё раз</button><button class="big-btn ghost" data-go="writing">К письму</button></div>`;
    const cur = s.pool[s.idx];
    const reveal = s.revealed
      ? `<div class="ok-msg" style="text-align:left">Образец: <b>${cur.model}</b> ${this.speakBtn(cur.model)}</div>
         <button class="big-btn primary" data-action="self-next">Дальше →</button>`
      : `<button class="big-btn primary" data-action="self-reveal">Показать образец</button>`;
    return `<header class="page-head"><h2>🪪 О себе</h2><div class="counter">${s.idx + 1}/${s.pool.length}</div></header>
      <button class="back" data-go="writing">← Письмо</button>
      <div class="quiz-prompt"><div class="type-ru">${cur.ask}</div></div>
      <textarea id="selfText" class="type-input area" placeholder="Напиши ответ по-гречески…">${this.esc(s.text)}</textarea>
      <div id="reveal">${reveal}</div>`;
  },

  /* ---------- ГОВОРЕНИЕ (фразы вслух + распознавание) ---------- */
  // Греческие числительные → цифра (распознавание возвращает цифры)
  NUM: {
    "μηδεν":"0","ενα":"1","μια":"1","δυο":"2","τρια":"3","τρεις":"3","τεσσερα":"4","τεσσερις":"4",
    "πεντε":"5","εξι":"6","εφτα":"7","επτα":"7","οχτω":"8","οκτω":"8","εννια":"9","εννεα":"9","δεκα":"10",
    "εντεκα":"11","δωδεκα":"12","εικοσι":"20","τριαντα":"30","σαραντα":"40","πενηντα":"50","εξηντα":"60",
    "εβδομηντα":"70","ογδοντα":"80","ενενηντα":"90","εκατο":"100","χιλια":"1000",
  },
  speechTokens(text) {
    const toks = (text || "").match(/\d+|[Ͱ-Ͽἀ-῿]+/g) || [];
    return toks.map((t) => {
      if (/^\d+$/.test(t)) return t;
      const ng = this.normGreek(t);
      return this.NUM[ng] || this.phoneticGreek(t);
    }).filter(Boolean);
  },
  // Совпало ли произнесённое с целью (с учётом чисел и омофонов)
  phraseMatch(target, alts) {
    const tt = this.speechTokens(target);
    const tjoin = tt.join(" ");
    return alts.some((a) => {
      const ht = this.speechTokens(a);
      if (ht.join(" ") === tjoin) return true;
      return tt.length > 0 && tt.every((x) => ht.includes(x));
    });
  },

  buildSpeaking() {
    if (this._speaking) return this._speaking;
    const out = [];
    const seen = new Set();
    const add = (gr, ru) => { const k = this.normGreek(gr); if (gr && !seen.has(k)) { seen.add(k); out.push({ gr, ru }); } };
    const ph = DECKS.find((d) => d.id === "phrases"); if (ph) ph.words.forEach((w) => add(w.gr, w.ru));
    const gr = DECKS.find((d) => d.id === "greetings"); if (gr) gr.words.forEach((w) => add(w.gr, w.ru));
    if (typeof WRITING_ORDER !== "undefined") WRITING_ORDER.forEach((s) => add(s.tokens.join(" "), s.ru));
    this._speaking = out;
    return out;
  },

  renderSpeaking() {
    if (!this.session) {
      if (!Recog.supported) {
        return `<header class="page-head"><h2>🗣️ Говорение</h2></header>
          <div class="banner">🎤 Распознавание речи не поддерживается этим браузером (на iPhone его нет). Открой сайт в <b>Chrome</b> на Android или компьютере.</div>`;
      }
      this.session = { pool: this.shuffle(this.buildSpeaking()), idx: 0, correct: 0, scored: false };
    }
    const s = this.session;
    if (s.idx >= s.pool.length) {
      return `<div class="result"><h2>Готово! 🎉</h2><p class="big-score">${s.correct} / ${s.pool.length}</p>
        <p class="muted">фраз произнесено верно</p>
        <button class="big-btn primary" data-action="spk-again">Ещё раунд</button>
        <button class="big-btn ghost" data-go="home">На главную</button></div>`;
    }
    const cur = s.pool[s.idx];
    return `
      <header class="page-head"><h2>🗣️ Говорение</h2><div class="counter">${s.idx + 1}/${s.pool.length}</div></header>
      <p class="muted small">Прочитай фразу вслух по-гречески. Нажми 🔊 послушать образец, потом 🎤 и говори.</p>
      <div class="quiz-prompt">
        <div class="flash-gr">${cur.gr} ${this.speakBtn(cur.gr)}</div>
        <div class="muted">${cur.ru}</div>
      </div>
      <button class="play-slow" data-say-slow="${this.esc(cur.gr)}">🐢 Медленно</button>
      <button class="mic-btn" data-action="spk-start">🎤 Произнести фразу</button>
      <div id="fb" class="feedback"></div>`;
  },

  speakStartPhrase() {
    const cur = this.session.pool[this.session.idx];
    const mic = document.querySelector(".mic-btn");
    const fb = document.getElementById("fb");
    Recog.listen(
      (alts) => this.speakPhraseResult(alts, cur),
      (code) => {
        if (mic) { mic.classList.remove("rec"); mic.innerHTML = "🎤 Произнести фразу"; mic.disabled = false; }
        const msg = code === "not-allowed" || code === "service-not-allowed"
          ? "Доступ к микрофону запрещён. Разреши его в браузере."
          : code === "nomatch" ? "Не расслышал. Чётче и ещё раз." : "Не получилось. Ещё раз.";
        if (fb) fb.innerHTML = `<div class="bad-msg">${msg}</div>`;
      },
      () => { if (mic) { mic.classList.add("rec"); mic.innerHTML = "🔴 Слушаю… говори"; mic.disabled = true; } if (fb) fb.innerHTML = ""; }
    );
  },

  speakPhraseResult(alts, cur) {
    const s = this.session;
    const mic = document.querySelector(".mic-btn");
    if (mic) { mic.classList.remove("rec"); mic.innerHTML = "🎤 Сказать снова"; mic.disabled = false; }
    const ok = this.phraseMatch(cur.gr, alts);
    if (ok && !s.scored) s.correct++;
    s.scored = true;
    const heard = alts[0] || "—";
    const fb = document.getElementById("fb");
    fb.innerHTML = `<div class="${ok ? "ok-msg" : "bad-msg"}">
        ${ok ? "✓ Отлично!" : "✗ Почти"} ${this.speakBtn(cur.gr)}
        <div class="answer-ru">Услышал: «${this.esc(heard)}»</div>
      </div>
      <button class="big-btn primary" id="nextBtn">${s.idx + 1 >= s.pool.length ? "Результат →" : "Дальше →"}</button>`;
    fb.querySelector("#nextBtn").addEventListener("click", () => { s.idx++; s.scored = false; this.render(); });
    this.afterAnswer();
  },

  /* ---------- ЧТЕНИЕ (graded readers) ---------- */
  readingDone() {
    try { return JSON.parse(localStorage.getItem("greekA1_reading_done")) || {}; }
    catch { return {}; }
  },
  isRead(id) { return !!this.readingDone()[id]; },
  markRead(id) {
    const d = this.readingDone();
    d[id] = true;
    localStorage.setItem("greekA1_reading_done", JSON.stringify(d));
    if (window.Cloud && window.Cloud.push) window.Cloud.push();
  },

  renderReadingList() {
    const done = this.readingDone();
    const groups = ["A0", "A0+", "A1"].map((lv) => {
      const items = READING_TEXTS.filter((t) => t.level === lv).map((t) => `
        <button class="deck-tile" data-read="${t.id}">
          <div class="deck-ic">${done[t.id] ? "✅" : "📖"}</div>
          <div class="deck-body"><div class="deck-title">${t.title}</div>
          <div class="deck-meta">${t.genre} · ${t.titleRu}</div></div>
        </button>`).join("");
      return `<h3 class="section-title">Уровень ${lv}</h3><div class="deck-list">${items}</div>`;
    }).join("");
    const total = READING_TEXTS.length;
    const read = READING_TEXTS.filter((t) => done[t.id]).length;
    return `
      <header class="page-head"><h2>📕 Чтение</h2></header>
      <p class="muted">Короткие тексты от A0 до честного A1. Тапни слово — перевод и звук; тапни 🇷🇺 — перевод фразы. Прочитано <b>${read}/${total}</b>.</p>
      ${groups}`;
  },

  // Словарь для тап-перевода: текст > общий > словарь приложения
  buildGloss(t) {
    const g = {};
    ALL_WORDS.forEach((w) => { const k = this.normGreek(w.gr); if (k && !k.includes(" ")) g[k] = w.ru; });
    Object.entries(READING_COMMON).forEach(([k, v]) => { g[this.normGreek(k)] = v; });
    Object.entries(t.gloss).forEach(([k, v]) => { g[this.normGreek(k)] = v; });
    return g;
  },

  buildReadWords(gr) {
    const parts = gr.match(/[Ͱ-Ͽἀ-῿]+|[^Ͱ-Ͽἀ-῿]+/g) || [];
    return parts.map((p) => {
      if (/[Ͱ-Ͽἀ-῿]/.test(p)) {
        return `<span class="rword" data-rw="${this.esc(this.normGreek(p))}" data-ro="${this.esc(p)}">${this.esc(p)}</span>`;
      }
      return this.esc(p);
    }).join("");
  },

  renderRead() {
    const t = READING_TEXTS.find((x) => x.id === this.params.id);
    if (!t) return this.renderReadingList();
    this._gloss = this.buildGloss(t);
    const sents = t.sents.map((p, i) => `
      <div class="r-sent">
        <span class="r-text">${this.buildReadWords(p[0])}</span>
        <span class="r-tools"><button class="r-ic" data-say="${this.esc(p[0])}">🔊</button><button class="r-ic" data-rtr="${i}">🇷🇺</button></span>
        <div class="r-trans" id="rtrans-${i}" hidden>${p[1]}</div>
      </div>`).join("");
    const readBtn = this.isRead(t.id)
      ? `<button class="big-btn ghost" data-action="read-done" data-id="${t.id}">✅ Прочитано</button>`
      : `<button class="big-btn primary" data-action="read-done" data-id="${t.id}">✓ Отметить прочитанным</button>`;
    return `
      <header class="page-head"><h2>${t.title}</h2><button class="back" data-go="reading">← Чтение</button></header>
      <div class="r-meta"><span class="lvl-badge">${t.level}</span> ${t.genre} · ${t.titleRu}</div>
      <button class="big-btn primary slim" data-action="read-all">🔊 Озвучить весь текст</button>
      <p class="muted small">Тапни слово — перевод и звук. Тапни 🇷🇺 у строки — перевод предложения.</p>
      <div class="reader">${sents}</div>
      ${readBtn}`;
  },

  showWord(norm, orig) {
    const tr = (this._gloss && this._gloss[norm]) || this.globalGloss()[norm] || "";
    const bar = document.getElementById("wordbar");
    if (!bar) return;
    bar.querySelector(".wb-gr").textContent = orig;
    bar.querySelector(".wb-ru").textContent = tr || "— (нет в словаре)";
    bar.querySelector(".wb-spk").dataset.say = orig;
    bar.hidden = false;
    Speech.say(orig);
  },

  rTrans(i) {
    const el = document.getElementById("rtrans-" + i);
    if (el) el.hidden = !el.hidden;
  },

  /* ---------- ЭКЗАМЕНЫ ---------- */
  examBest() {
    try { return JSON.parse(localStorage.getItem("greekA1_exam_best")) || {}; }
    catch { return {}; }
  },
  saveExamBest(n, pct) {

      b[n] = pct;
      localStorage.setItem("greekA1_exam_best", JSON.stringify(b));
      if (window.Cloud && window.Cloud.push) window.Cloud.push();
    }

  // Кнопка аккаунта в шапке (видна на всех экранах)
  renderTopAccount() {

  renderAccount() {

    }
